<tr>
  <td width="72" valign="top" style="padding:14px 16px 14px 0;border-bottom:1px solid #EFEFEF;vertical-align:top;">
    {{#if image}}<img src="{{image}}" width="72" height="72" alt="{{name}}" style="display:block;width:72px;height:72px;border:0;background:#EFEFEF;">{{else}}<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="72" bgcolor="#EFEFEF" style="background-color:#EFEFEF;"><tr><td height="72" style="height:72px;line-height:72px;font-size:0;">&nbsp;</td></tr></table>{{/if}}
  </td>
  <td valign="top" style="$td$">
    <p class="mono" style="$mono-sm$margin:0 0 2px 0;">{{#if brand}}{{brand}} <span style="color:#EA3E39;">/</span> {{/if}}{{sku}}</p>
    <p style="$h4-nomargin$">{{name}}</p>
    <p class="mono" style="$mono-sm$margin:4px 0 0 0;">{{qty}} × {{unit_price}}</p>
  </td>
  <td valign="top" align="right" style="$td-right$">{{line_total}}</td>
</tr>
